<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Core Golden Radial Glow -->
    <radialGradient id="lumoraCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Ambient Glow -->
    <radialGradient id="lumoraAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B1026" stop-opacity="0"/>
    </radialGradient>

    <!-- Ray Gradients -->
    <linearGradient id="rayVertical" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="rayHorizontal" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="rayDiagonal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="rayDiagonal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="lumoraTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#2563EB"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow behind star -->
  <circle cx="250" cy="160" r="140" fill="url(#lumoraAmbientGlow)"/>

  <!-- Star Rays Group -->
  <g transform="translate(250, 160)" filter="url(#glowFilter)">
    
    <!-- Primary Horizontal Sharp Spike -->
    <polygon points="0,-7 190,0 0,7 -190,0" fill="url(#rayHorizontal)"/>

    <!-- Primary Vertical Sharp Spike -->
    <polygon points="-7,0 0,-150 7,0 0,150" fill="url(#rayVertical)"/>

    <!-- Diagonal Spike 1 (45 deg) -->
    <g transform="rotate(45)">
      <polygon points="-5,0 0,-115 5,0 0,115" fill="url(#rayDiagonal1)"/>
    </g>

    <!-- Diagonal Spike 2 (135 deg) -->
    <g transform="rotate(135)">
      <polygon points="-5,0 0,-115 5,0 0,115" fill="url(#rayDiagonal2)"/>
    </g>

    <!-- Secondary Accent Rays (22.5 deg steps for 16-point radiance) -->
    <g transform="rotate(22.5)">
      <polygon points="-2.5,0 0,-70 2.5,0 0,70" fill="#FBBF24" opacity="0.8"/>
    </g>
    <g transform="rotate(67.5)">
      <polygon points="-2.5,0 0,-70 2.5,0 0,70" fill="#38BDF8" opacity="0.8"/>
    </g>
    <g transform="rotate(112.5)">
      <polygon points="-2.5,0 0,-70 2.5,0 0,70" fill="#7C3AED" opacity="0.8"/>
    </g>
    <g transform="rotate(157.5)">
      <polygon points="-2.5,0 0,-70 2.5,0 0,70" fill="#EC4899" opacity="0.8"/>
    </g>

    <!-- Golden & White Core Flares -->
    <circle cx="0" cy="0" r="38" fill="url(#lumoraCoreGlow)"/>
    <circle cx="0" cy="0" r="16" fill="#FFFBEB"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>

    <!-- Twinkling Sparkles around Star -->
    <!-- Top Left Sparkle -->
    <g transform="translate(-80, -70) scale(0.4)">
      <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#FBBF24"/>
    </g>
    <!-- Top Right Sparkle -->
    <g transform="translate(85, -60) scale(0.35)">
      <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#38BDF8"/>
    </g>
    <!-- Bottom Left Sparkle -->
    <g transform="translate(-70, 75) scale(0.3)">
      <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#7C3AED"/>
    </g>
    <!-- Bottom Right Sparkle -->
    <g transform="translate(90, 65) scale(0.4)">
      <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#FBBF24"/>
    </g>
  </g>

  <!-- Wordmark "LUMORA" -->
  <text x="250" y="325" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-weight="800" 
        font-size="42" 
        letter-spacing="14" 
        fill="url(#lumoraTextGrad)">LUMORA</text>
</svg>
